<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualizar password · Momentum Systems</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <main class="section">
    <div class="container" style="max-width: 560px;">
      <span class="section-label">Recuperación de acceso</span>
      <h1 style="margin-top: 14px;">Actualizar password</h1>
      <p style="color: #5F6F89;">
        Introduzca una nueva contraseña para su cuenta corporativa.
      </p>

      <div style="margin-top: 28px; padding: 28px; border: 1px solid rgba(18,102,220,0.12); border-radius: 24px; background: rgba(255,255,255,0.9);">
        <label style="display: grid; gap: 8px; font-weight: 600;">
          Nueva password
          <input
            id="newPassword"
            type="password"
            placeholder="Nueva password"
            style="height: 52px; border-radius: 16px; border: 1px solid rgba(18,102,220,0.14); padding: 0 16px;"
          />
        </label>

        <button class="button button-primary full-width" id="updatePasswordButton" type="button" style="margin-top: 18px;">
          Actualizar password
        </button>

        <p id="passwordMessage" style="margin-top: 16px; color: #5F6F89;"></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://nvcafxnfszxgfwyoaxzg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52Y2FmeG5mc3p4Z2Z3eW9heHpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTc0ODYsImV4cCI6MjA5NTI5MzQ4Nn0.tjnGCjlfvMFvsQ1Mkallio0zFcI14KTO7nEVaSZdZv8";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.getElementById("updatePasswordButton").addEventListener("click", async () => {
      const password = document.getElementById("newPassword").value.trim();
      const message = document.getElementById("passwordMessage");

      if (!password || password.length < 8) {
        message.textContent = "El password debe tener al menos 8 caracteres.";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password
      });

      if (error) {
        message.textContent = "No se pudo actualizar la password. Abra de nuevo el enlace recibido por email.";
        return;
      }

      message.textContent = "Password actualizado correctamente. Redirigiendo...";
      setTimeout(() => {
        window.location.href = "client-area.html";
      }, 1200);
    });
  </script>
</body>
</html>
