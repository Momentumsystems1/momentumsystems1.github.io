name: Deploy Momentum Client SaaS AppDashboard

on:
  push:
    branches: [main]
    paths:
      - 'deploy-packages/momentum-client-saas-appdashboard/minparts/**'
      - '.github/workflows/deploy-momentum-client-saas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-momentum-client-saas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-packages/momentum-client-saas-appdashboard/minparts/chunk_*             | tr -d '\n\r'             | base64 -d > /tmp/momentum-client-saas.zip
          unzip -t /tmp/momentum-client-saas.zip

      - name: Publish isolated review
        shell: bash
        run: |
          set -euo pipefail
          TARGET="reviews/momentum-client-saas-appdashboard"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          unzip -q /tmp/momentum-client-saas.zip -d "$TARGET"
          touch "$TARGET/.nojekyll"

      - name: Commit generated review files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/momentum-client-saas-appdashboard
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Deploy Momentum Client SaaS AppDashboard preview"
          git push origin main
