<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MY CLUSTER — diagnóstico de mapas</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #141518; color: #f8f9fa; margin: 0; padding: 24px 16px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }
  .card { background: #1f2125; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid #2a2d33; font-size: 13px; }
  .row:first-of-type { border-top: 0; }
  .badge { font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .ok { background: #1e3a2f; color: #6dd58c; }
  .bad { background: #3a1e1e; color: #ff8a80; }
  .wait { background: #3a331e; color: #fdd663; }
  .mapbox { width: 100%; height: 220px; border-radius: 10px; background: #0c0d0f; margin-top: 10px; }
  .key { color: #9aa0a6; font-size: 11px; word-break: break-all; }
  #summary { margin-top: 8px; font-size: 13px; color: #c4c7cc; white-space: pre-wrap; }
  button { background: #d93025; color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>
<h1>Diagnóstico de mapas MY CLUSTER</h1>
<p class="sub">Esta página prueba las dos claves de Google Maps desde tu dispositivo y tu red. Tarda hasta 1 minuto. Envía una captura de esta pantalla si algo falla.</p>
<div id="root"></div>
<div id="summary"></div>
<button onclick="location.reload()">Repetir prueba</button>
<script>
const KEYS = [
  { name: "Key principal", key: "AIzaSyCpLR28oNC9n9MIUSsxF0OEXlMLqXCicns" },
  { name: "Key de respaldo", key: "AIzaSyDVj-1Ci9VwwcCi9kirQK3O00eP8mSAY70" }
];
const root = document.getElementById("root");
const summary = document.getElementById("summary");
const lines = [];
const log = (s) => { lines.push(s); summary.textContent = lines.join("\n"); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function badge(state) {
  if (state === "ok") return '<span class="badge ok">OK</span>';
  if (state === "bad") return '<span class="badge bad">FALLO</span>';
  return '<span class="badge wait">probando…</span>';
}
function setRow(id, state, note) {
  const el = document.getElementById(id);
  if (el) { el.querySelector(".b").innerHTML = badge(state); if (note != null) el.querySelector(".n").textContent = note; }
}

async function tryKey(k) {
  const safe = k.key.slice(0, 8) + "…" + k.key.slice(-4);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<h2>' + k.name + ' <span class="key">' + safe + '</span></h2>'
    + '<div class="row" id="' + k.name + '-script"><span>Script de Google</span><span class="n"></span><span class="b">' + badge("wait") + '</span></div>'
    + '<div class="row" id="' + k.name + '-api"><span>API de mapas</span><span class="n"></span><span class="b">' + badge("wait") + '</span></div>'
    + '<div class="row" id="' + k.name + '-map"><span>Mapa real (azulejos)</span><span class="n"></span><span class="b">' + badge("wait") + '</span></div>'
    + '<div class="mapbox" id="' + k.name + '-box"></div>';
  root.appendChild(card);
  const box = document.getElementById(k.name + "-box");

  // 1) cargar el script
  const t0 = performance.now();
  const ok = await new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + k.key + "&v=weekly&loading=async";
    s.async = true;
    const to = setTimeout(() => resolve(false), 20000);
    s.onload = () => { clearTimeout(to); resolve(true); };
    s.onerror = () => { clearTimeout(to); resolve(false); };
    document.head.appendChild(s);
  });
  if (!ok) { setRow(k.name + "-script", "bad", "no cargó en 20 s"); setRow(k.name + "-api", "bad", "—"); setRow(k.name + "-map", "bad", "—"); log(k.name + ": script NO cargó"); return; }
  setRow(k.name + "-script", "ok", Math.round(performance.now() - t0) + " ms");

  // 2) esperar a que exista window.google.maps (loading=async)
  let found = false;
  for (let i = 0; i < 150; i++) { if (window.google && window.google.maps) { found = true; break; } await sleep(100); }
  if (!found) { setRow(k.name + "-api", "bad", "no apareció tras el script"); setRow(k.name + "-map", "bad", "—"); log(k.name + ": API NO disponible tras cargar el script"); return; }
  setRow(k.name + "-api", "ok", "google.maps lista");

  // 3) intentar un mapa real y comprobar que llegan azulejos
  try {
    const map = new google.maps.Map(box, { center: { lat: 40.4168, lng: -3.7038 }, zoom: 14, disableDefaultUI: true });
    const tiles = await new Promise((resolve) => {
      let painted = 0;
      const obs = new MutationObserver(() => { painted = box.querySelectorAll("img").length; });
      obs.observe(box, { childList: true, subtree: true });
      setTimeout(() => { obs.disconnect(); resolve(painted); }, 8000);
    });
    if (tiles > 3) { setRow(k.name + "-map", "ok", tiles + " azulejos pintados"); log(k.name + ": MAPA FUNCIONA (" + tiles + " azulejos)"); }
    else { setRow(k.name + "-map", "bad", "sin azulejos (¿key restringida?)"); log(k.name + ": API lista pero SIN azulejos — sospecha de restricción de referrer"); }
  } catch (e) {
    setRow(k.name + "-map", "bad", String(e).slice(0, 60));
    log(k.name + ": error creando el mapa: " + String(e).slice(0, 80));
  }
}

(async () => {
  for (const k of KEYS) { if (k.key && !k.key.startsWith("__")) await tryKey(k); }
  log("— Fin del diagnóstico —");
})();
</script>
</body>
</html>
